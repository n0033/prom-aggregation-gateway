name: release new version

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  release-binaries:
    runs-on: ubuntu-latest

    steps:
      - name: checkout the source code
        uses: actions/checkout@v6

      - uses: wistia/parse-tool-versions@v1.0

      - uses: actions/setup-go@v6
        with:
          go-version: "${{ env.GOLANG_TOOL_VERSION }}"

      - name: Extract tag name
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV

      - name: Extract short sha
        run: echo "SHORT_SHA=$(git rev-parse --short "$GITHUB_SHA")" >> $GITHUB_ENV

      - name: Build and upload the binaries
        run: make release-binaries VERSION=${{ env.RELEASE_VERSION }} COMMIT_SHA=${{ env.SHORT_SHA }} TOKEN=${{ secrets.GITHUB_TOKEN }}

  release-image:
    runs-on: ubuntu-latest

    steps:
      - name: checkout the source code
        uses: actions/checkout@v3

      - uses: wistia/parse-tool-versions@v1.0

      - name: Extract tag name
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV

      - name: Extract short sha
        run: echo "SHORT_SHA=$(git rev-parse --short "$GITHUB_SHA")" >> $GITHUB_ENV

      - name: login to registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}:latest,ghcr.io/${{ github.repository_owner }}:${{ env.RELEASE_VERSION }}
